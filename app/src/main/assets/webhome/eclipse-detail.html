    /* Eclipse detail consumes the same read-only semantic tokens as the native UI. */

    * { box-sizing: border-box; }

      color: var(--eclipse-detail-color-17);

    }

    .hidden { display: none !important; }

    .brand strong { display: block; letter-spacing: 0; line-height: 1; }

    .actions { display: flex; flex-wrap: wrap; margin-top: 27px; }

      border-radius: 8px; background: var(--eclipse-detail-color-59); cursor: pointer; font-weight: bold;

    .action.primary { color: var(--eclipse-detail-color-60); border-color: var(--eclipse-detail-color-61); background: linear-gradient(100deg, var(--eclipse-detail-color-62), var(--eclipse-detail-color-63)); box-shadow: 0 8px 26px rgba(69, 216, 241, .18); }
    .action.favorite[aria-pressed="true"] { color: var(--eclipse-detail-color-64); border-color: var(--eclipse-detail-color-65); background: var(--eclipse-detail-color-66); }
    .action:disabled { opacity: .5; cursor: default; }
    .section { margin-top: 34px; padding: 27px 0 4px; border-top: 1px solid var(--eclipse-detail-color-67); }
    .section-head { display: flex; align-items: flex-end; margin-bottom: 17px; }
    .section-head h2 { margin: 0; font-size: 22px; }
    .section-head p { margin: 0 0 2px 12px; color: var(--eclipse-detail-color-68); font-size: 12px; }
    .people-grid, .gallery-strip, .recommendation-grid {
      display: flex; gap: 14px; margin: -8px -10px -6px; padding: 11px 12px 18px; overflow-x: auto; overflow-y: hidden;
      overscroll-behavior-inline: contain; scrollbar-width: thin; scroll-padding-inline: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .horizontal-rail > * { scroll-snap-align: start; }
    .person-card { flex: 0 0 126px; min-width: 0; padding: 0; overflow: hidden; color: inherit; text-align: left; border: 1px solid var(--eclipse-detail-color-69); border-radius: 8px; background: var(--eclipse-detail-color-28); }
    .person-photo { position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: var(--eclipse-detail-color-70); }
    .person-photo img { width: 100%; height: 100%; object-fit: cover; }
    .person-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--eclipse-detail-color-71); background: var(--eclipse-detail-color-72); font-size: 28px; font-weight: bold; }
    .person-copy { min-height: 72px; padding: 10px; }

    .person-name { color: var(--eclipse-detail-color-73); font-size: 13px; font-weight: bold; }
    .person-role { margin-top: 4px; color: var(--eclipse-detail-color-74); font-size: 11px; }
    .gallery-item { flex: 0 0 300px; aspect-ratio: 16 / 9; margin: 0; padding: 0; overflow: hidden; color: inherit; border: 1px solid var(--eclipse-detail-color-69); border-radius: 8px; background: var(--eclipse-detail-color-28); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    }
    button.recommendation-card { cursor: pointer; }

      border-radius: 8px; color: var(--eclipse-detail-color-92); background: var(--eclipse-detail-color-28); cursor: pointer; font-size: 12px;

    .episode:focus .episode-marquee-track.overflowing,

      width: max-content; min-width: 100%; overflow: visible; text-overflow: clip;
      animation-name: episode-marquee;
      animation-duration: var(--episode-marquee-duration, 7s);
      animation-timing-function: linear;
      animation-delay: 650ms;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    @keyframes episode-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(calc(0px - var(--episode-marquee-distance, 0px))); }

<body>
  <div class="shell">
    <header class="topbar">
      <button id="backButton" class="back" type="button" aria-label="返回">‹</button>
      <div class="brand" aria-label="Eclipse 主题">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><strong>ECLIPSE</strong><small>DETAIL EXPERIENCE</small></span>
      </div>
      <div id="sourceName" class="source-pill">正在连接内容源</div>
    </header>

    <main>
      <section id="loadingPanel" class="panel loading-panel" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <h1>正在展开光影档案</h1>
        <p>从当前内容源安全读取详情与选集</p>
      </section>

      <section id="errorPanel" class="panel error-panel hidden" aria-live="assertive">
        <div class="error-icon" aria-hidden="true">!</div>
        <h1>详情暂时无法显示</h1>
        <p id="errorMessage">可以重试，或切换到原生详情页。</p>
        <div class="error-actions">
          <button id="retryButton" class="action primary" type="button">重新加载</button>
          <button id="errorNativeButton" class="action" type="button">使用原生详情</button>
        </div>
      </section>

      <div id="content" class="hidden">
        <article class="panel hero" aria-labelledby="title">
          <img id="heroBackdrop" class="hero-backdrop hidden" alt="">
          <div class="hero-shade" aria-hidden="true"></div>
          <div class="poster-wrap">
            <div class="poster">
              <span id="posterFallback" class="poster-fallback" aria-hidden="true">影</span>
              <img id="poster" class="hidden" alt="">
            </div>
            <div id="progressCard" class="progress-card hidden">
              <div class="progress-label"><span>上次观看</span><span id="progressText">0%</span></div>
              <div class="progress-track"><div id="progressValue" class="progress-value"></div></div>
            </div>
          </div>

          <div class="hero-copy">
            <div class="eyebrow">CURRENT SOURCE · VOD DETAIL</div>
            <h1 id="title">未命名影片</h1>
            <p id="remarks" class="remarks hidden"></p>
            <p id="tagline" class="remarks hidden"></p>
            <ul id="meta" class="meta"></ul>
            <div id="credits" class="credits"></div>
            <p id="summary" class="summary hidden"></p>
            <div class="actions">
              <button id="playButton" class="action primary" type="button" data-focus-row="actions">▶ 播放</button>
              <button id="favoriteButton" class="action favorite" type="button" data-focus-row="actions" aria-pressed="false">♡ 收藏</button>
              <button id="nativeButton" class="action" type="button" data-focus-row="actions">原生详情</button>
            </div>
          </div>
        </article>

        <section id="peopleSection" class="section hidden" aria-labelledby="peopleHeading">
          <div class="section-head">
            <h2 id="peopleHeading">演员与主创</h2>
            <p id="peopleStatus"></p>
          </div>
          <div id="people" class="people-grid horizontal-rail"></div>
        </section>

        <section class="section" aria-labelledby="episodeHeading">
          <div class="section-head">
            <h2 id="episodeHeading">播放线路与选集</h2>
            <p id="episodeOverview"></p>
          </div>
          <div id="lineTabs" class="line-tabs" role="tablist" aria-label="播放线路"></div>
          <article id="episodeFeature" class="episode-feature hidden" aria-live="polite">
            <div class="episode-still">
              <span id="episodeStillFallback" class="episode-still-fallback">暂无剧照</span>
              <img id="episodeStill" class="hidden" alt="">
            </div>
            <div class="episode-feature-copy">
              <p id="episodeKicker" class="episode-kicker"></p>
              <h3 id="episodeFeatureTitle"></h3>
              <div id="episodeFacts" class="episode-facts"></div>
              <p id="episodeFeatureOverview" class="episode-overview"></p>
            </div>
          </article>
          <div id="episodeRanges" class="episode-ranges horizontal-rail hidden" role="tablist" aria-label="选集范围"></div>
          <div class="episode-toolbar">
            <span id="episodeStatus">请选择集数</span>
            <div id="pager" class="pager hidden">
              <button id="prevPage" type="button" data-focus-row="episode-pager" aria-label="上一组选集">‹</button>
              <span id="pageText">1 / 1</span>
              <button id="nextPage" type="button" data-focus-row="episode-pager" aria-label="下一组选集">›</button>
            </div>
          </div>
          <div id="episodes" class="episodes" role="tabpanel"></div>
        </section>

        <section id="gallerySection" class="section hidden" aria-labelledby="galleryHeading">
          <div class="section-head">
            <h2 id="galleryHeading">剧照</h2>
            <p id="galleryStatus"></p>
          </div>
          <div id="gallery" class="gallery-strip horizontal-rail"></div>
        </section>

        <section id="recommendationSection" class="section hidden" aria-labelledby="recommendationHeading">
          <div class="section-head">
            <h2 id="recommendationHeading">推荐</h2>
            <p id="recommendationStatus"></p>
          </div>
          <div id="recommendationGroups" class="recommendation-groups"></div>
        </section>

        <section id="externalSection" class="section hidden" aria-labelledby="externalHeading">
          <div class="section-head">
            <h2 id="externalHeading">外部链接</h2>
            <p id="externalStatus"></p>
          </div>
          <div id="externalLinks" class="external-links"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="eclipse-focus-navigation.js"></script>
  <script src="eclipse-detail-state.js"></script>
  <script>
    (function (w, d) {
      'use strict';
      var EPISODE_GROUP_SIZE = 20;
      var app = { booted: false, info: null, data: null, state: null, toastTimer: 0, fallbackTimer: 0, pending: false, refreshing: false, refreshQueued: false };

      function byId(id) { return d.getElementById(id); }
      function text(value) { return value === null || typeof value === 'undefined' ? '' : String(value); }
      function array(value) { return Object.prototype.toString.call(value) === '[object Array]' ? value : []; }
      function setText(id, value) { var node = byId(id); if (node) node.textContent = text(value); }
      function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
      function show(node, visible) { if (node) node.className = node.className.replace(/\s*hidden\b/g, '') + (visible ? '' : ' hidden'); }
      function nativeApi() { return w.fm || w.fongmi || null; }

      function applyNativeTokens(info) {
        var tokens = info && info.tokens;
        var root = d.documentElement;
        if (!tokens || !root || !root.style) return;
        var map = {
          primary: '--webhtv-primary',
          onPrimary: '--webhtv-on-primary',
          surface: '--webhtv-surface',
          surfaceContainer: '--webhtv-surface-container',
          surfaceContainerHigh: '--webhtv-surface-container-high',
          onSurface: '--webhtv-on-surface',
          onSurfaceVariant: '--webhtv-on-surface-variant',
          outline: '--webhtv-outline',
          outlineVariant: '--webhtv-outline-variant',
          error: '--webhtv-error',
          success: '--webhtv-success',
          warning: '--webhtv-warning',
          focus: '--webhtv-focus'
        };
        Object.keys(map).forEach(function (key) {
          if (typeof tokens[key] === 'string') root.style.setProperty(map[key], tokens[key]);
        });
        root.setAttribute('data-theme-source', 'native');
      }

      function toast(message) {
        var node = byId('toast');
        node.textContent = text(message);
        node.className = 'toast show';
        w.clearTimeout(app.toastTimer);
        app.toastTimer = w.setTimeout(function () { node.className = 'toast'; }, 2600);
      }

      function optional(id, value) {
        var node = byId(id);
        node.textContent = text(value);
        show(node, !!text(value));
      }

      function addMeta(value, accent) {
        if (!text(value)) return;
        var item = d.createElement('li');
        if (accent) item.className = 'accent';
        item.textContent = text(value);
        byId('meta').appendChild(item);
      }

      function addCredit(label, value) {
        if (!text(value)) return;
        var row = d.createElement('p');
        var strong = d.createElement('strong');
        strong.textContent = label + '：';
        row.appendChild(strong);
        row.appendChild(d.createTextNode(text(value)));
        byId('credits').appendChild(row);
      }

      function renderPoster(item) {
        var image = byId('poster');
        var url = w.EclipseDetailState.safeImageUrl(item.pic);
        image.alt = text(item.name) ? text(item.name) + ' 海报' : '影片海报';
        byId('posterFallback').textContent = text(item.name).slice(0, 1) || '影';
        if (!url) { show(image, false); return; }
        image.onload = function () { show(image, true); };
        image.onerror = function () { show(image, false); };
        image.src = url;
      }

      function renderBackdrop(media) {
        var image = byId('heroBackdrop');
        var url = w.EclipseDetailState.safeImageUrl(media && media.backdrop);
        if (!url) { show(image, false); image.removeAttribute('src'); return; }
        image.onload = function () { show(image, true); };
        image.onerror = function () { show(image, false); };
        image.src = url;
      }

      function statusLabel(value) {
        return ({
          'Returning Series': '连载中',
          'Ended': '已完结',
          'Canceled': '已取消',
          'In Production': '制作中',
          'Released': '已上映',
          'Post Production': '后期制作'
        })[text(value)] || text(value);
      }

      function renderProgress(history) {
        var duration = Number(history && history.durationMs) || 0;
        var position = Number(history && history.positionMs) || 0;
        var percent = duration > 0 ? Math.max(0, Math.min(100, Math.round(position * 100 / duration))) : 0;
        show(byId('progressCard'), duration > 0 && position > 0);
        setText('progressText', percent + '%');
        byId('progressValue').style.width = percent + '%';
      }

      function renderHero() {
        var item = app.data.item || {};
        var media = app.data.media || {};
        setText('sourceName', (app.data.source && app.data.source.name) || (app.info.source && app.info.source.name) || '当前内容源');
        setText('title', item.name || '未命名影片');
        optional('remarks', item.remarks);
        optional('tagline', media.tagline);
        clear(byId('meta'));
        if (Number(media.rating) > 0) addMeta('★ ' + Number(media.rating).toFixed(1), true);
        addMeta(item.year);
        addMeta(item.area);
        addMeta(item.typeName);
        addMeta(statusLabel(media.status));
        if (Number(media.seasonCount) > 0) addMeta(Number(media.seasonCount) + ' 季');
        if (Number(media.episodeCount) > 0) addMeta(Number(media.episodeCount) + ' 集');
        if (Number(media.runtimeMinutes) > 0) addMeta(Number(media.runtimeMinutes) + ' 分钟');
        clear(byId('credits'));
        addCredit('导演', item.director);
        addCredit('演员', item.actor);
        addCredit('原名', media.originalName && media.originalName !== item.name ? media.originalName : '');
        optional('summary', item.content);
        renderPoster(item);
        renderBackdrop(media);
        renderProgress(app.data.state && app.data.state.history);
        renderFavorite();
      }

      function renderFavorite() {
        var button = byId('favoriteButton');
        var favorite = Boolean(app.state && app.state.favorite);
        button.setAttribute('aria-pressed', favorite ? 'true' : 'false');
        button.textContent = favorite ? '♥ 已收藏' : '♡ 收藏';
      }

      function cardImage(url, alt, className, fallback) {
        var safe = w.EclipseDetailState.safeImageUrl(url);
        if (!safe) return null;
        var image = d.createElement('img');
        image.className = className || 'hidden';
        image.alt = text(alt);
        image.onload = function () {
          image.className = '';
          if (fallback) show(fallback, false);
        };
        image.onerror = function () { image.remove(); };
        image.src = safe;
        return image;
      }

      function actionFailure(result, fallback) {
        if (!result || typeof result.catch !== 'function') return;
        result.catch(function (error) { toast(error && error.message ? error.message : fallback); });
      }

      function bindLongPress(node, handler) {
        var timer = 0;
        var fired = false;
        var resetTimer = 0;
        function clearTimer() {
          if (!timer) return;
          w.clearTimeout(timer);
          timer = 0;
        }
        function markFired(event) {
          if (event && typeof event.preventDefault === 'function') event.preventDefault();
          if (fired) return;
          clearTimer();
          fired = true;
          w.clearTimeout(resetTimer);
          resetTimer = w.setTimeout(function () { fired = false; }, 1200);
          handler();
        }
        function schedule(event) {
          if (timer || fired) return;
          timer = w.setTimeout(function () { timer = 0; markFired(event); }, 650);
        }
        node.addEventListener('pointerdown', function (event) {
          if (typeof event.button === 'number' && event.button !== 0) return;
          schedule(event);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (name) {
          node.addEventListener(name, clearTimer);
        });
        node.addEventListener('contextmenu', markFired);
        node.addEventListener('keydown', function (event) {
          if (event.key === 'ContextMenu' || event.key === 'F2') {
            markFired(event);
            return;
          }
          if (event.key !== 'Enter' && event.key !== ' ' && event.key !== 'Select') return;
          if (event.repeat) markFired(event);
          else schedule(event);
        });
        node.addEventListener('keyup', function (event) {
          if (event.key === 'Enter' || event.key === ' ' || event.key === 'Select') clearTimer();
        });
        node.addEventListener('click', function (event) {
          if (!fired) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          fired = false;
          w.clearTimeout(resetTimer);
        }, true);
      }

      function openPerson(person) {
        var api = nativeApi();
        if (!api || !api.person || typeof api.person.open !== 'function' || !text(person && person.personRef)) return;
        actionFailure(api.person.open(person.personRef), '无法打开人物详情');
      }

      function renderPeople() {
        var root = byId('people');
        var values = array(app.data.people);
        var capabilities = app.data.capabilities || {};
        var api = nativeApi();
        var canOpen = Boolean(capabilities.canOpenPeople && api && api.person && typeof api.person.open === 'function');
        var castCount = 0;
        var crewCount = 0;
        clear(root);
        values.forEach(function (person) {
          var interactive = Boolean(canOpen && text(person.personRef));
          var card = d.createElement(interactive ? 'button' : 'article');
          var photo = d.createElement('div');
          var fallback = d.createElement('span');
          var copy = d.createElement('div');
          var name = d.createElement('span');
          var role = d.createElement('span');
          var image;
          card.className = 'person-card';
          card.tabIndex = interactive ? 0 : -1;
          if (interactive) {
            card.type = 'button';
            card.setAttribute('data-focus-row', 'people');
            card.addEventListener('click', function () { openPerson(person); });
          }
          card.setAttribute('data-person-id', text(person.personRef || (person.kind + '-' + (person.personId || person.name))));
          photo.className = 'person-photo';
          fallback.className = 'person-fallback';
          fallback.textContent = text(person.name).slice(0, 1) || '影';
          photo.appendChild(fallback);
          image = cardImage(person.profile, text(person.name) + ' 人物照片', 'hidden', fallback);
          if (image) photo.appendChild(image);
          copy.className = 'person-copy';
          name.className = 'person-name';
          name.textContent = person.name || '未命名';
          role.className = 'person-role';
          role.textContent = person.role || person.department || (person.kind === 'crew' ? '主创' : '演员');
          copy.appendChild(name);
          copy.appendChild(role);
          card.appendChild(photo);
          card.appendChild(copy);
          root.appendChild(card);
          if (person.kind === 'crew') crewCount += 1;
          else castCount += 1;
        });
        setText('peopleStatus', (castCount ? castCount + ' 位演员' : '')
          + (castCount && crewCount ? ' · ' : '') + (crewCount ? crewCount + ' 位主创' : ''));
        show(byId('peopleSection'), values.length > 0);
      }

      function previewImage(item) {
        var api = nativeApi();
        if (!api || !api.image || typeof api.image.preview !== 'function' || !text(item && item.imageRef)) return;
        actionFailure(api.image.preview(item.imageRef), '无法预览原图');
      }

      function saveImage(item) {
        var api = nativeApi();
        if (!api || !api.image || typeof api.image.save !== 'function' || !text(item && item.imageRef)) return;
        actionFailure(api.image.save(item.imageRef), '无法保存原图');
      }

      function renderGallery() {
        var root = byId('gallery');
        var item = app.data.item || {};
        var capabilities = app.data.capabilities || {};
        var api = nativeApi();
        var values = array(app.data.galleryItems).map(function (value) {
          return { imageRef: text(value && value.imageRef), preview: w.EclipseDetailState.safeImageUrl(value && value.preview) };
        }).filter(function (value) { return !!value.preview; });
        var canPreview = Boolean(capabilities.canPreviewImages && api && api.image && typeof api.image.preview === 'function');
        var canSave = Boolean(capabilities.canSaveImages && api && api.image && typeof api.image.save === 'function');
        if (!values.length) {
          values = array(app.data.gallery).map(function (value) {
            return { imageRef: '', preview: w.EclipseDetailState.safeImageUrl(value) };
          }).filter(function (value) { return !!value.preview; });
        }
        clear(root);
        values.forEach(function (value, index) {
          var interactive = Boolean((canPreview || canSave) && value.imageRef);
          var frame = d.createElement(interactive ? 'button' : 'figure');
          var image = cardImage(value.preview, (item.name || '影片') + ' 剧照 ' + (index + 1), '');
          frame.className = 'gallery-item';
          frame.tabIndex = interactive ? 0 : -1;
          if (interactive) {
            frame.type = 'button';
            frame.setAttribute('data-focus-row', 'gallery');
            frame.addEventListener('click', function () {
              if (canPreview) previewImage(value);
              else saveImage(value);
            });
          }
          frame.setAttribute('data-gallery-id', text(value.imageRef || index));
          if (canSave && value.imageRef) {
            frame.addEventListener('contextmenu', function (event) { event.preventDefault(); saveImage(value); });
            frame.addEventListener('keydown', function (event) {
              if (event.key === 'ContextMenu' || event.key === 's' || event.key === 'S') {
                event.preventDefault();
                saveImage(value);
              }
            });
          }
          if (image) frame.appendChild(image);
          root.appendChild(frame);
        });
        setText('galleryStatus', values.length + ' 张' + (canPreview ? ' · 点击查看原图' : (canSave ? ' · 点击保存原图' : '')));
        show(byId('gallerySection'), values.length > 0);
      }

      function normalizedRecommendationGroups() {
        var groups = array(app.data.recommendationGroups).filter(function (group) {
          return group && array(group.items).length > 0;
        });
        if (!groups.length && array(app.data.recommendations).length) {
          groups = [{ id: 'related', title: '相关推荐', source: 'related', items: app.data.recommendations }];
        }
        return groups;
      }

      function openRecommendation(item) {
        var api = nativeApi();
        if (api && api.recommendation && typeof api.recommendation.open === 'function' && text(item && item.recommendationRef)) {
          actionFailure(api.recommendation.open(item.recommendationRef), '无法打开该推荐');
          return;
        }
        if (api && api.app && typeof api.app.search === 'function' && text(item && item.name)) {
          actionFailure(api.app.search(item.name), '无法搜索该影片');
        } else if (api && typeof api.search === 'function' && text(item && item.name)) {
          actionFailure(api.search(item.name), '无法搜索该影片');
        }
      }

      function openRecommendationInfo(item) {
        var api = nativeApi();
        if (!api || !api.recommendation || typeof api.recommendation.info !== 'function'
          || !text(item && item.recommendationRef)) return;
        actionFailure(api.recommendation.info(item.recommendationRef), '无法打开推荐说明');
      }

      function updateRecommendationSummary() {
        var root = byId('recommendationGroups');
        var groups = root ? root.querySelectorAll('.recommendation-group') : [];

      function ensureRailItemVisible(node) {
        var rail = node && node.parentElement;
        var railRect;
        var itemRect;
        var padding = 10;
        var delta = 0;
        if (!rail || !rail.classList || !rail.classList.contains('horizontal-rail')) return;
        railRect = rail.getBoundingClientRect();
        itemRect = node.getBoundingClientRect();
        if (itemRect.left < railRect.left + padding) delta = itemRect.left - railRect.left - padding;
        else if (itemRect.right > railRect.right - padding) delta = itemRect.right - railRect.right + padding;
        if (Math.abs(delta) > 0.5) rail.scrollLeft += delta;
      }

      function safeInset(name) {
        var value = w.getComputedStyle(d.documentElement).getPropertyValue(name);
        return Math.max(0, Number.parseFloat(value) || 0);
      }

      function ensureEpisodeContextVisible(node) {
        var feature = byId('episodeFeature');
        if (!node.classList || !node.classList.contains('episode') || w.innerWidth < 900
          || !feature || feature.classList.contains('hidden')) return false;
        w.requestAnimationFrame(function () {
          var featureRect = feature.getBoundingClientRect();
          var nodeRect = node.getBoundingClientRect();
          var top = safeInset('--fm-safe-top') + 12;
          var bottom = w.innerHeight - safeInset('--fm-safe-bottom') - 18;
          if (nodeRect.bottom - featureRect.top <= bottom - top) {
            w.scrollBy(0, featureRect.top - top);
          } else {
            try { node.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
            catch (ignore) { node.scrollIntoView(false); }
          }
          ensureRailItemVisible(node);
        });
        return true;
      }

      function ensureFocusVisible(node) {
        if (!node || node === d.body) return;
        if (ensureEpisodeContextVisible(node)) return;
        try { node.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
        catch (ignore) { node.scrollIntoView(false); }
        w.requestAnimationFrame(function () { ensureRailItemVisible(node); });
      }
      function focusByData(attribute, value) {
        var nodes = d.querySelectorAll('[' + attribute + ']');
        var index;
        for (index = 0; index < nodes.length; index += 1) {
          if (nodes[index].getAttribute(attribute) === text(value)) {
            nodes[index].focus();
            ensureFocusVisible(nodes[index]);
            return true;
          }
        }
        return false;
      }

      function updateEpisodeMarquee(track) {
        w.requestAnimationFrame(function () {
          var viewport = track && track.parentNode;
          if (!viewport || !track.isConnected) return;
          track.classList.remove('overflowing');
          track.style.removeProperty('--episode-marquee-distance');
          track.style.removeProperty('--episode-marquee-duration');
          var distance = Math.max(0, track.scrollWidth - viewport.clientWidth);
          if (distance <= 2) return;
          track.classList.add('overflowing');
          track.style.setProperty('--episode-marquee-distance', distance + 'px');
          track.style.setProperty('--episode-marquee-duration', Math.max(5, Math.min(13, 4 + distance / 28)) + 's');
        });
      }

      function focusByRow(row, rowIndex) {
        var nodes = d.querySelectorAll('[data-focus-row]');
        var matches = [];
        var index;
        var node;
        for (index = 0; index < nodes.length; index += 1) {
          node = nodes[index];
          if (node.getAttribute('data-focus-row') !== text(row) || node.disabled) continue;
          if (node.getBoundingClientRect().width > 0 && node.getBoundingClientRect().height > 0) matches.push(node);
        }
        if (!matches.length) return false;
        node = matches[Math.min(Math.max(0, Number(rowIndex) || 0), matches.length - 1)];
        node.focus();
        ensureFocusVisible(node);
        return true;
      }

      function focusMarker() {
        var node = d.activeElement;
        var attributes = ['data-source-id', 'data-episode-id', 'data-episode-page', 'data-person-id', 'data-gallery-id', 'data-recommendation-id', 'data-external-id'];
        var marker = {};
        var rowNodes;
        var row;
        var index;
        var rowIndex = 0;
        if (!node || node === d.body) return null;
        if (node.id) marker.id = node.id;
        for (index = 0; index < attributes.length; index += 1) {
          if (node.hasAttribute && node.hasAttribute(attributes[index])) {
            marker.attribute = attributes[index];
            marker.value = node.getAttribute(attributes[index]);
            break;
          }
        }
        row = node.getAttribute && node.getAttribute('data-focus-row');
        if (row) {
          rowNodes = d.querySelectorAll('[data-focus-row]');
          for (index = 0; index < rowNodes.length; index += 1) {
            if (rowNodes[index].getAttribute('data-focus-row') !== row) continue;
            if (rowNodes[index] === node) break;
            rowIndex += 1;
          }
          marker.row = row;
          marker.rowIndex = rowIndex;
        }
        return marker.id || marker.attribute || marker.row ? marker : null;
      }

      function restoreFocus(marker) {
        if (!marker) return false;
        if (marker.id && byId(marker.id) && !byId(marker.id).disabled) {
          byId(marker.id).focus();
          return true;
        }
        if (marker.attribute && focusByData(marker.attribute, marker.value)) return true;
        return marker.row ? focusByRow(marker.row, marker.rowIndex) : false;
      }

      function render(preserveState, marker) {
        app.state = preserveState
          ? w.EclipseDetailState.refresh(app.state, app.data, EPISODE_GROUP_SIZE)
          : w.EclipseDetailState.create(app.data, EPISODE_GROUP_SIZE);
        renderHero();
        renderPeople();
        renderLines();
        renderEpisodes();
        renderGallery();
        renderRecommendationGroups();
        renderExternalLinks();
        setPending(false);
        clearNativeFallback();
        show(byId('loadingPanel'), false);
        show(byId('errorPanel'), false);
        show(byId('content'), true);
        if (preserveState) w.setTimeout(function () { if (!restoreFocus(marker)) byId('playButton').focus(); }, 20);
        else if (app.info && app.info.client && app.info.client.isLeanback) w.setTimeout(function () { byId('playButton').focus(); }, 30);
      }

      function loadDetail() {
        var api = nativeApi();
        if (!api || typeof api.themeInfo !== 'function' || typeof api.vodDetail !== 'function') return;
        clearNativeFallback();
        show(byId('loadingPanel'), true);
        show(byId('errorPanel'), false);
        show(byId('content'), false);
        api.themeInfo().then(function (info) {
          applyNativeTokens(info || {});
          app.info = info || {};
          return api.vodDetail({ vodId: info && info.route ? info.route.vodId : '' });
        }).then(function (data) {
          app.data = data || {};
          render(false, null);
          if (app.refreshQueued) {
            app.refreshQueued = false;
            refreshDetail();
          }
        }).catch(function (error) {
          showError(error);
          scheduleNativeFallback();
        });
      }

      function refreshDetail() {
        var api = nativeApi();
        var item = app.data && app.data.item;
        if (!api || typeof api.vodDetail !== 'function') return;
        if (!item) { app.refreshQueued = true; return; }
        if (app.refreshing) { app.refreshQueued = true; return; }
        app.refreshing = true;
        api.vodDetail({ vodId: item.vodId || '', cached: true }).then(function (data) {
          var marker = focusMarker();
          app.data = data || app.data;
          render(true, marker);
        }).catch(function () {
        }).then(function () {
          app.refreshing = false;
          if (app.refreshQueued) {
            app.refreshQueued = false;
            refreshDetail();
          }
        });
      }

      function focusables() {
        return Array.prototype.slice.call(d.querySelectorAll('button:not([disabled]),[tabindex="0"]')).filter(function (node) {
          var rect = node.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
      }

      function moveFocus(direction) {
        var nodes = focusables();
        var current = d.activeElement;
        var index = nodes.indexOf(current);
        if (index < 0) { if (nodes.length) nodes[0].focus(); return; }
        var geometry = nodes.map(function (node) {
          var rect = node.getBoundingClientRect();
          return {
            left: rect.left,
            top: rect.top,
            width: rect.width,
            height: rect.height,
            row: node.getAttribute('data-focus-row') || ''
          };
        });
        var targetIndex = w.EclipseFocusNavigation.nextFocusIndex(geometry, index, direction);
        var best = targetIndex >= 0 ? nodes[targetIndex] : null;
        if (best) {
          best.focus();
          ensureFocusVisible(best);
        }
      }

      function bind() {
        byId('backButton').addEventListener('click', goBack);
        byId('retryButton').addEventListener('click', loadDetail);
        byId('errorNativeButton').addEventListener('click', openNative);
        byId('nativeButton').addEventListener('click', openNative);
        byId('playButton').addEventListener('click', playSelected);
        byId('favoriteButton').addEventListener('click', toggleFavorite);
        byId('prevPage').addEventListener('click', function () { app.state.page -= 1; renderEpisodes(); });
        byId('nextPage').addEventListener('click', function () { app.state.page += 1; renderEpisodes(); });
        d.addEventListener('focusin', function (event) { ensureFocusVisible(event.target); });
        d.addEventListener('keydown', function (event) {
          var direction = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[event.key];
          if (direction) { event.preventDefault(); moveFocus(direction); }
          else if (event.key === 'Escape' || event.key === 'BrowserBack') { event.preventDefault(); goBack(); }
        });
        w.addEventListener('fmresume', function () {
          app.paused = false;
          if (!app.data || !app.data.item) {
            loadDetail();
            return;
          }
          refreshDetail();
          w.setTimeout(function () {
            if (d.activeElement && d.activeElement !== d.body) return;
            if (!focusByData('data-episode-id', app.state && app.state.episodeId)) byId('playButton').focus();
          }, 40);
        });
        w.addEventListener('fmpause', function () {
          app.paused = true;
          clearNativeFallback();
        });
        w.addEventListener('fmviewport', function () { ensureFocusVisible(d.activeElement); });
        w.addEventListener('fmdetailchange', refreshDetail);
      }

      function boot() {
        if (app.booted) { loadDetail(); return; }
        app.booted = true;
        bind();
        loadDetail();
      }

      w.addEventListener('fmsdk', boot);
      if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', function () { if (nativeApi()) boot(); });
      else if (nativeApi()) boot();
      w.setTimeout(function () { if (!app.booted && nativeApi()) boot(); }, 350);
      w.onerror = function (message) {
        showError(new Error(text(message) || '详情页脚本异常'));
        scheduleNativeFallback();
      };
    }(window, document));
  </script>
</body>
</html>
