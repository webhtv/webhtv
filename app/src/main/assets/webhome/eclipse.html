  <style>
    :root {

      --eclipse-active-safe-top: 0px;
    }
    @supports (top: max(0px, 1px)) {

    html.safe-top-active { --eclipse-active-safe-top: var(--eclipse-safe-top); }

    html, body { min-height: 100%; margin: 0; }
    body {

      background: #080b15;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      overflow-x: hidden;
    }
    body:before, body:after {
      position: fixed;
      z-index: -2;
      width: 46vw;
      height: 46vw;
      border-radius: 50%;
      content: "";
      opacity: .18;
      pointer-events: none;
    }
    body:before { top: -24vw; left: -12vw; background: #6e5bff; box-shadow: 0 0 130px #6e5bff; }
    body:after { right: -22vw; top: 18vh; background: #00d8ff; box-shadow: 0 0 150px #00d8ff; }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell {
      width: 100%; max-width: 1680px; margin: 0 auto; padding: 24px 42px 56px;
      padding-top: calc(24px + var(--eclipse-active-safe-top, 0px));

    .topbar {

      min-height: 58px;
      margin-bottom: 22px;
    }
    .brand { display: flex; align-items: center; margin-right: 26px; white-space: nowrap; }

      height: 42px;

      position: absolute;
      right: -4px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #36e8ff;
      box-shadow: 0 0 13px #36e8ff;
      content: "";
    }
    .brand strong { display: block; font-size: 20px; letter-spacing: 3px; line-height: 1; }
    .brand small { display: block; margin-top: 5px; color: #8c97b7; font-size: 10px; letter-spacing: 1.6px; }

      max-width: 230px;
      height: 34px;
      margin-right: auto;
      padding: 7px 12px;
      overflow: hidden;
      color: #9ca7c6;
      border: 1px solid #252c45;
      border-radius: 18px;
      background: rgba(17, 22, 39, .85);
      cursor: pointer;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .source-pill:before { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #45e6b1; content: ""; box-shadow: 0 0 8px #45e6b1; }
    .search { display: flex; width: 330px; margin-left: 14px; }
    .search input {

    }
    .hero {

      display: flex;
      min-height: 310px;
      margin-bottom: 30px;
      overflow: hidden;
      border: 1px solid #242b45;

      background: #1a2038; box-shadow: 0 18px 45px rgba(0,0,0,.52), 0 0 34px rgba(91, 218, 255, .22);
      transform: rotate(5deg);

    .featured-poster img { width: 100%; height: 100%; object-fit: cover; }

    .section-head p { margin: 0 0 2px 13px; color: #7782a3; font-size: 12px; }
    .status { margin-left: auto; color: #8490b2; font-size: 12px; }
    .tabs, .filters { display: flex; padding: 2px 2px 9px; overflow-x: auto; overflow-y: hidden; }
    .tabs { margin-bottom: 13px; }
    .filters { margin: -5px 0 13px; }
    .tab, .filter-chip {

    .auto-page.loading { color: #dfe5ff; }
    .loading .grid { opacity: .45; }

      border: 1px solid #394362; border-radius: 12px; color: #fff; background: rgba(12,16,29,.96);
      box-shadow: 0 12px 35px rgba(0,0,0,.4); opacity: 0; pointer-events: none;
      transform: translate(-50%, 14px); transition: opacity .18s ease, transform .18s ease;
    }

    button:focus, input:focus { outline: 0; }

    }
    .card-button:focus .poster {
      border-color: #fff;
      box-shadow: 0 0 0 3px #785fff;
    }
    .search input:focus { border-color: #67e8ff; box-shadow: inset 0 0 0 1px #67e8ff, 0 0 18px rgba(80,220,255,.2); }
    .noscript { margin: 30px; padding: 20px; border: 1px solid #5d4665; border-radius: 12px; background: #211425; }
    @media (max-width: 1200px) { .card { width: 20%; } .hero-copy { width: 64%; } .hero-art { width: 36%; } }
    @media (max-width: 900px) {

      .hero p { font-size: 12px; }
      .hero-meta { margin-top: 17px; }

      .meta-cell span { font-size: 9px; }

      .section-head p { display: none; }
      .card { width: 33.333%; padding: 0 5px 17px; }
      .grid { margin: 0 -5px; }

      .card-title { font-size: 16px; }
    }

<body>
  <noscript><div class="noscript">Eclipse 皮肤需要启用 JavaScript。</div></noscript>
  <main class="shell" id="app" aria-busy="true">
    <header class="topbar">
      <div class="brand" aria-label="Eclipse WebHome">
        <span class="brand-mark"></span>
        <span><strong>ECLIPSE</strong><small>UNIVERSAL WEBHOME</small></span>
      </div>
      <button class="source-pill" data-focus="source" id="sourceName" type="button" aria-label="切换内容源">正在连接内容源</button>
      <form class="search" id="searchForm">
        <input id="searchInput" data-focus="search" type="search" autocomplete="off" placeholder="搜索当前内容源" aria-label="搜索">
        <button data-focus="search-submit" type="submit" aria-label="提交搜索">⌕</button>
      </form>
      <button class="top-action" data-focus="library" id="libraryButton" type="button">媒体库</button>
      <button class="top-action settings-action" data-focus="settings" id="settingsButton" type="button">设置</button>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-copy">
        <div class="eyebrow">NOW ORBITING · WEBHOME V1</div>
        <h1 id="heroTitle">一个皮肤，连接当前内容源</h1>
        <p id="heroText">Eclipse 使用稳定的 WebHome 数据桥接，在手机与电视上呈现同一套内容体验。</p>
        <div class="hero-meta">
          <div class="meta-cell"><strong id="itemCount">--</strong><span>推荐内容</span></div>
          <div class="meta-cell"><strong id="classCount">--</strong><span>内容分类</span></div>
          <div class="meta-cell"><strong id="clientMode">--</strong><span>当前设备</span></div>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="featured-poster"><img id="featuredImage" alt=""><span id="featuredName">Eclipse</span></div>
      </div>
    </section>

    <section aria-labelledby="contentTitle">
      <div class="section-head">
        <h2 id="contentTitle">探索内容</h2>
        <p id="contentHint">按分类浏览当前源</p>
        <span class="status" id="statusText">准备中</span>
      </div>
      <div class="tabs" id="classTabs" role="tablist" aria-label="内容分类"></div>
      <div class="filters" id="filters" aria-label="筛选条件"></div>
      <div class="grid" id="contentGrid"></div>
      <div class="auto-page" id="autoPage" role="status" aria-live="polite"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

        hostRect = host.getBoundingClientRect();

        if (!hostRect.width || !cardRect.width) return 1;
        var count = Math.round(hostRect.width / cardRect.width);

      function applyCategory(data, request) {

        if (!request.append && state.native && w.EclipseCategoryDiagnostics && !state.truncated) {

        pairKey = [queryTypeId, duplicate.typeId].sort().join('\u001f');

      function getFocusableSnapshot() {
        var nodes = d.querySelectorAll('[data-focus]');
        var list = [];
        var rects = [];
        var i;
        for (i = 0; i < nodes.length; i += 1) {
          var rect = nodes[i].getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0 && !nodes[i].disabled) {
            list.push(nodes[i]);
            rects.push(rect);
          }
        }
        return { list: list, rects: rects };
      }

      function getFocusable() {
        return getFocusableSnapshot().list;
      }

      function rememberFocus(event) {
        var target = event.target;
        if (!target || !target.getAttribute) return;
        var key = target.getAttribute('data-focus');
        if (!key) return;
        state.focusKey = key;
        try { w.sessionStorage.setItem('eclipse.focus', key); } catch (ignore) {}
      }

      function restoreFocus() {
        w.setTimeout(function () {
          var key = state.focusKey;
          var list;
          var i;
          if (!key) {
            try { key = w.sessionStorage.getItem('eclipse.focus') || ''; } catch (ignore) {}
          }
          if (!key) return;
          list = getFocusable();
          for (i = 0; i < list.length; i += 1) {
            if (list[i].getAttribute('data-focus') === key) {
              try { list[i].focus(); } catch (ignore2) {}
              return;
            }
          }
        }, 20);
      }

      function reveal(element, cachedRect) {
        var rect = cachedRect || element.getBoundingClientRect();
        var topGuard = 70;
        var bottomGuard = w.innerHeight - 55;
        if (rect.top < topGuard) w.scrollTo(0, w.pageYOffset + rect.top - topGuard > 0 ? w.pageYOffset + rect.top - topGuard : 0);
        else if (rect.bottom > bottomGuard) w.scrollTo(0, w.pageYOffset + rect.bottom - bottomGuard);
      }

      function moveFocusInRow(list, rects, current, direction) {
        var row = current && current.getAttribute ? current.getAttribute('data-focus-row') : '';
        var items = [];
        var currentIndex = -1;
        var targetIndex;
        var i;
        if ((direction !== 'left' && direction !== 'right') || !row || !w.EclipseFocusNavigation) return false;
        for (i = 0; i < list.length; i += 1) {
          var rect = rects[i];
          items.push({
            row: list[i].getAttribute('data-focus-row') || '',
            x: rect.left + rect.width / 2
          });
          if (list[i] === current) currentIndex = i;
        }
        targetIndex = w.EclipseFocusNavigation.findHorizontalTarget(items, currentIndex, direction);
        if (targetIndex >= 0) {
          list[targetIndex].focus();
          reveal(list[targetIndex], rects[targetIndex]);
        }
        return true;
      }

      function moveFocus(direction) {
        var snapshot = getFocusableSnapshot();
        var list = snapshot.list;
        var current = d.activeElement;
        var currentIndex;
        var currentRect;
        var cx;
        var cy;
        var best = null;
        var bestRect = null;
        var bestScore = Number.MAX_VALUE;
        var i;
        if (!list.length) return;
        currentIndex = list.indexOf(current);
        if (!current || currentIndex < 0) {
          list[0].focus();
          reveal(list[0], snapshot.rects[0]);
          return;
        }
        if (moveFocusInRow(list, snapshot.rects, current, direction)) return;
        currentRect = snapshot.rects[currentIndex];
        cx = currentRect.left + currentRect.width / 2;
        cy = currentRect.top + currentRect.height / 2;
        for (i = 0; i < list.length; i += 1) {
          var candidate = list[i];
          var rect;
          var x;
          var y;
          var primary;
          var secondary;
          var score;
          if (candidate === current) continue;
          rect = snapshot.rects[i];
          x = rect.left + rect.width / 2;
          y = rect.top + rect.height / 2;
          if (direction === 'left' && x >= cx - 3) continue;
          if (direction === 'right' && x <= cx + 3) continue;
          if (direction === 'up' && y >= cy - 3) continue;
          if (direction === 'down' && y <= cy + 3) continue;
          primary = direction === 'left' || direction === 'right' ? Math.abs(x - cx) : Math.abs(y - cy);
          secondary = direction === 'left' || direction === 'right' ? Math.abs(y - cy) : Math.abs(x - cx);
          if (secondary > primary) continue;
          score = primary * 10 + secondary * secondary / (primary > 1 ? primary : 1);
          if (score < bestScore) {
            bestScore = score;
            best = candidate;
            bestRect = rect;
          }
        }
        if (best) {
          best.focus();
          reveal(best, bestRect);
        }
      }

      function keydown(event) {
        var code = event.keyCode || event.which;
        var direction = code === 37 ? 'left' : code === 38 ? 'up' : code === 39 ? 'right' : code === 40 ? 'down' : '';
        var target = event.target;
        if (!direction) return;
        if (target && target.tagName === 'INPUT' && (direction === 'left' || direction === 'right')) return;
        event.preventDefault();
        moveFocus(direction);
      }

      function bind() {
        if (state.domReady) return;
        state.domReady = true;
        w.__eclipseBoot.dom = true;
        listen(byId('searchForm'), 'submit', submitSearch);
        listen(byId('sourceName'), 'click', function () { callApp('openSite', '此操作需要在应用内使用'); });
        listen(byId('libraryButton'), 'click', function () { callApp('openVod', '此操作需要在应用内使用'); });
        listen(byId('settingsButton'), 'click', function () { callApp('openSetting', '此操作需要在应用内使用'); });
        listen(d, 'focusin', handleFocusIn);
        listen(d, 'keydown', keydown);
        listen(w, 'scroll', scheduleAutoPageCheck);
        listen(w, 'resize', scheduleAutoPageCheck);
        refreshSafeAreaMode();
        applyHome(fallbackHome());
        w.setTimeout(function () {
          if (hasNative()) requestNativeHome();
        }, 60);
        w.setTimeout(function () {
          if (!state.native && hasNative()) requestNativeHome();
        }, 700);
      }

      listen(w, 'fmviewport', function (event) {
        updateSafeAreaMode(event && event.detail ? event.detail : {});
      });
      listen(w, 'fmresume', refreshSafeAreaMode);
      listen(w, 'fmsdk', function () {
        state.nativeRequested = false;
        refreshSafeAreaMode();
        requestNativeHome();
      });
      if (d.readyState === 'loading') listen(d, 'DOMContentLoaded', bind); else bind();
    }(window, document));
  </script>
</body>
